[package]
name = "beatflow-desktop"
version = "1.9.2"
description = "BeatFlow Desktop Music Player"
authors = ["Abhi Devkota <abhidevkota1234@gmail.com>"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "beatflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
base64 = "0.22"
dirs = "6.0"
anyhow = "1.0"
url = "2.5"
roxmltree = "0.21"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
