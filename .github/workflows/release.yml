name: Prod Release (signed)

on:
  push:
    branches: [prod/install]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > beatflow-release.jks
          {
            echo "storeFile=beatflow-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'bitchordVersionName\s*=\s*"\K[^"]+' build.gradle.kts)
          VERSION_CODE=$(grep -oP 'bitchordVersionCode\s*=\s*\K[0-9]+' build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed prod release
        run: ./gradlew :app:assembleProdRelease :tv:assembleProdRelease :wearos:assembleProdRelease

      - name: Stage APKs with release names
        run: |
          mkdir -p release-assets
          VN="${{ steps.version.outputs.name }}"
          # Phone: app-prod-<abi>-release.apk -> BeatFlow-<version>[_<abi>].apk
          for f in app/build/outputs/apk/prod/release/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if echo "$base" | grep -q "universal"; then
              cp "$f" "release-assets/BeatFlow-${VN}.apk"
            else
              abi=$(echo "$base" | sed -E 's/app-prod-(.+)-release\.apk/\1/')
              cp "$f" "release-assets/BeatFlow-${VN}_${abi}.apk"
            fi
          done
          # TV
          for f in tv/build/outputs/apk/prod/release/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if echo "$base" | grep -q "universal"; then
              cp "$f" "release-assets/BeatFlowTV-${VN}.apk"
            else
              abi=$(echo "$base" | sed -E 's/tv-prod-(.+)-release\.apk/\1/')
              cp "$f" "release-assets/BeatFlowTV-${VN}_${abi}.apk"
            fi
          done
          # Wear OS
          for f in wearos/build/outputs/apk/prod/release/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            cp "$f" "release-assets/BeatFlowWear-${VN}.apk"
          done
          ls -la release-assets

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beatflow-prod-release-signed
          path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: BeatFlow v${{ steps.version.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
